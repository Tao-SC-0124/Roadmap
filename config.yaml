# 产业信息卡统一工作区配置（本地）
# 规则默认值不要随意改；这里只负责本机路径与按需配置。

timezone: Asia/Shanghai
# 按需推卡：不设固定时间；用户请求时跑一张，最多 1 张
run_mode: on_demand
cards_per_run: 1
# 用户已 init 日期目录则直接用；没有则自动创建 正式卡/YYYYMMDD/
auto_create_date_folder: true
take_pass_prompt: true
dedupe_days: 20

# 2026-11-10 用户确认的筛选标准
screening:
  decline_windows_trading_days: [60, 120, 250]
  decline_metrics: ["interval_return", "max_drawdown"]
  require_decline_ranking: true
  require_node_for_push: true
  node_min_tier: "A"
  resonance_priority: ["node_quality", "decline_resolvability", "bc", "purity"]
  exclude_st: true
  min_listing_days: 250
  min_avg_turnover: 0.0
  relative_benchmarks: ["industry", "csi300"]

no_new_policy: report  # 同日重复请求且无新增时：report 报「未检索到新的」；silence 只输出「暂无值得关注信息」
anchor_profile: v2_3

# 本工作区：daily push 的 HTML、推送文本、运行底稿、PDF 都在
# 报告评审记录/YYYYMMDD/ 下完成
output_dir: 正式卡
pdf_output_dir: 待打印PDF
date_folder_format: YYYYMMDD
state_dir: 报告评审记录/.state

# PDF 转换入口（V2.2/V2.3 卡与通用 HTML 都 ≤6 页；--formal 读 正式卡/ 写 待打印PDF/）
pdf_converter: 报告评审记录/scripts/convert-any.sh

# 研究缓存（不进 git）
research_dir: research

language: zh-CN
spec_version: v2.3
card_theme: v2.2
emit_png: false
max_pages: 6
